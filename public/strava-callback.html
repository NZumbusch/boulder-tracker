<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Back to Boulder Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #fafafa; --text: #18181b; --muted: #52525b; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0b; --text: #fafafa; --muted: #a1a1aa; --accent: #3b82f6; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; padding: 24px 16px; text-align: center; }
    p { color: var(--muted); }
    a.button { display: inline-block; margin-top: 8px; padding: 10px 20px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>Back to Boulder Tracker</h1>
  <p id="note">Opening the app…</p>
  <a id="open" class="button" href="bouldertracker://strava">Open Boulder Tracker</a>
</main>
<script>
  // Strava's login answer (?code=...&state=...) is handed to the Android app as a bouldertracker:// link.
  // Nothing is stored or sent anywhere from this page.
  (function () {
    var query = window.location.search;
    var target = 'bouldertracker://strava' + query;
    document.getElementById('open').href = target;
    if (!query) {
      document.getElementById('note').textContent = 'Nothing to hand over. Start the Strava connection from Boulder Tracker: Settings, Data & connections, Import activities.';
      document.getElementById('open').hidden = true;
      return;
    }
    window.location.replace(target);
    setTimeout(function () {
      document.getElementById('note').textContent = 'If the app did not open, tap the button. This works on the Android app only.';
    }, 1500);
  })();
</script>
</body>
</html>
